# Frozen evaluator thresholds for RuLongTTS (PLAN.md §3.4 final status).
#
# Owner: A4 (Evaluation). Implements the Lead decision of 2026-08-28
# ("статус на этапе генерации — предварительный (gen_status); финальный статус
# §3.4 присваивает evaluator"), reports/decisions.md.
#
# PRE-REGISTERED. Every number here was chosen on 2026-08-28 from the pilot ASR
# floor (20 human references) and the 8 integration outputs, i.e. BEFORE any
# hidden run and before any E2/E3 checkpoint exists. PLAN.md §3.5 / §9.3: the
# thresholds may only be revised on dev, and only with an entry in
# reports/decisions.md that says so explicitly. Changing them after seeing a
# hidden-test table is forbidden.
#
# Implementation: src/eval/final_status.py, applied by scripts/run_evaluation.py.
# Tests: tests/test_eval_known_cases.py (one case per branch).
#
# 2026-08-29 (A4, corpus replaced v1 -> v3.1): the corpus and the pilot benchmark
# were both rebuilt, so the EVIDENCE under the loop numbers was measured again on
# v3.1. NO THRESHOLD CHANGED (0.95 / 0.30 / 0.20 / run 3), `version` and
# `frozen_at` stay as they were -- only the comments of the `loop:` block below
# were rewritten to quote the v3.1 measurement instead of the v1 one. Tables,
# sources and the reproduce command: reports/eval_thresholds_v31.md, generated by
# scripts/eval_evidence_v31.py (CPU only, no ASR, no GPU) from
# results/v31_base/asr_floor.jsonl, results/v31_base/{E1,E0}/per_item.jsonl,
# data/manifests/dev.jsonl and data/benchmark/pilot.jsonl.

version: 1
frozen_at: "2026-08-28"
owner: A4
decision_ref: "reports/decisions.md, Lead 2026-08-28 (evaluator-side final status)"

final_status:
  # The generator's label is provisional (`gen_status`, derived from stop_reason
  # alone). The evaluator refines ONLY `gen_status == complete`; every other
  # §3.4 status (loop_cap, timeout, context_limit, oom, empty_or_invalid_audio,
  # infrastructure_error, hard_input_limit, degraded) passes through unchanged.
  refines_gen_status: [complete]

  # A `gen_status == complete` run must also have stopped by EOS. Any other
  # stop_reason under a `complete` gen_status is a contract violation of §10 and
  # makes the evaluator exit non-zero instead of guessing.
  require_stop_reason_for_complete: eos

  # The decision uses the metrics of the PRIMARY normalization variant
  # (configs/text_normalization.yaml: primary_variant). The strict variant is
  # reported next to it in per_item.jsonl as strict_*, but never decides status.
  metrics_variant: primary

  # complete  <- EOS and EndCoverage >= this and not looped and WER-floor < margin
  # early_eos <- EOS and EndCoverage <  this
  #
  # Justification: EndCoverage is the fraction of the source reached by the last
  # aligned word. The 8 integration runs split cleanly: E0 official-split reads
  # everything (EndCoverage 1.000 on 4/4) while E1 native stops at 0.710-0.839
  # (4/4). 0.95 leaves 5 % of the source for ASR/alignment noise at the tail and
  # is far from both clusters, so no integration item sits within 0.11 of it.
  # (Those two clusters are the v1 integration runs — the pre-registration
  # evidence, kept verbatim. The same statistic on the 120 v3.1 pilot items is in
  # reports/eval_thresholds_v31.md §5; the threshold was not revisited.)
  end_coverage_complete_min: 0.95

  # degraded <- EOS and EndCoverage >= end_coverage_complete_min and
  #             (WER - ASR floor >= this OR loop flag)
  #
  # Justification: the floor is the same ASR on the human recording of the same
  # text, so WER-floor is the model's own error. Integration: E0 -0.073..-0.021
  # (below the floor), E1 +0.084..+0.261 while still truncating. 0.30 marks
  # "one word in three wrong beyond what the ASR itself gets wrong", which no
  # v1 integration item reached; it is a degradation marker, not a nuisance
  # threshold. (Those ranges are the v1 pre-registration evidence, kept verbatim.
  # The same statistic on the 120 v3.1 pilot items is in
  # reports/eval_thresholds_v31.md §5 — on v3.1 E1 native does cross it, which is
  # the criterion firing as designed, not a reason to move it.)
  wer_minus_floor_degraded_min: 0.30

  # What to do when a benchmark text has no human reference audio (source:
  # external) and therefore no ASR floor: the WER criterion cannot be applied.
  # "skip" = such an item can only become `degraded` through the loop flag, and
  # per_item.jsonl records final_status_note = "no_floor_wer_criterion_skipped".
  # The alternative (comparing raw WER to a borrowed floor) would invent a
  # number, which PLAN.md §0 rule 7 / §9.4 forbid.
  wer_criterion_when_floor_missing: skip

  # A `gen_status == complete` run whose WAV is missing, unreadable or
  # transcribes to nothing cannot be `complete`: there is no audio to judge.
  # It is relabelled to this §3.4 status (A4 addition to the Lead rule, flagged
  # in reports/decisions.md; the adapter already emits the same status when it
  # can see the invalid audio itself).
  no_usable_audio_status: empty_or_invalid_audio

  # Loop rule. §3.4 has no `loop` status: a looped output that stopped by EOS is
  # `degraded` (a looped output that hit the watchdog is `loop_cap`, and that
  # label comes from the generator untouched).
  loop:
    # n-gram sizes for both criteria (matches src/eval/metrics.py DEFAULT_NGRAM_RANGE)
    ngram_range: [3, 8]

    # Criterion A -- dispersed repetition. Mean over n of the share of
    # hypothesis n-gram positions that repeat beyond what the source repeats
    # (src/eval/metrics.py: excess_repetition).
    #
    # Justification, re-measured on v3.1 (2026-08-29, primary/lenient variant;
    # the v1 numbers this comment used to carry are preserved in the A4 entry of
    # 2026-08-28 in reports/decisions.md):
    #   20 human reference transcriptions of the v3.1 pilot benchmark
    #     (40-915 ASR words)                    max 0.00018   mean 0.00001
    #   120 natural dev segments, 8.50 h, 7 channels, 42-1423 words,
    #     gigaam-v3-e2e-ctc vs the ROVER text   max 0.00393   mean 0.00032
    #   30 benchmark source texts vs themselves max 0.00000
    #   120 v3.1 pilot outputs (E1 native + E0 official, all transcribable)
    #                                           max 0.00379   mean 0.00007
    # None of these 290 items reaches 0.20: the threshold is ~51x the largest
    # value real speech produced here (0.00393) and ~1100x the largest human
    # reference value. A synthetic phrase repeated 9x back-to-back scores 0.6599.
    excess_repetition_rate_min: 0.20

    # Criterion B -- a back-to-back run. `max_ngram_run` is the longest
    # immediate repetition of one 3..8-word phrase in the hypothesis, discounted
    # by what the source itself repeats back-to-back (PLAN.md §7.3: source
    # repetition is not hallucination), so 1 = no back-to-back repetition.
    #
    # Justification, re-measured on v3.1 (2026-08-29): on every one of the 290
    # items listed above -- 20 human references, 120 natural dev segments,
    # 30 source texts scored against themselves, 120 v3.1 pilot outputs -- the
    # value is exactly 1, i.e. speech in this corpus never says the same 3..8-word
    # phrase twice in a row beyond what the source itself repeats. A threshold of
    # 3 ("the same phrase three times in a row, beyond the source") therefore has
    # two full steps of margin, and it catches the short loops that criterion A
    # misses: a phrase repeated 3x inside a 15-word hypothesis scores run = 3 but
    # only 0.1399 on criterion A, and 3x back-to-back after a 10-word source
    # scores run = 3 at 0.1290 -- both below 0.20, which is why the two criteria
    # are OR-ed.
    ngram_run_min: 3

    # The two criteria are combined with OR.
    combine: or

# WER-valid (PLAN.md §9.1) keeps its GENERATION-side denominator: a run whose
# gen_status is complete and that produced a readable WAV with a non-empty
# transcription. Conditioning it on the FINAL status would select on the outcome
# being measured (final `complete` already requires low WER-floor), which is a
# statistics bug, not a stricter definition. "Complete %" (§17) uses the final
# status; "Valid for WER-valid %" uses gen_status. Both are printed side by side.
wer_valid_denominator: gen_status
