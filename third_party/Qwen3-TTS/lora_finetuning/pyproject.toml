[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts"
version = "0.0.4"
description = "Qwen-TTS python package"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]

dependencies = [
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "datasets==5.0.0",
  "gradio",
  "librosa",
  "soundfile",
  "sox",
  "onnxruntime",
  "einops",
  "numpy>=2.2.6",
  "peft>=0.19.1",
  "wandb>=0.26.1",
  "hf-transfer>=0.1.9",
  "silero-stress==1.4",
  "tensorboard>=2.18",
  "onnx-asr>=0.8,<1",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "torchaudio>=2.11.0",
  "pandas>=2.3.3",
  "pyarrow>=24.0.0",
]

[project.optional-dependencies]
finetuning = [
  "peft",
  "pandas",
  "pyarrow",
  "tqdm",
  "wandb",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[project.urls]
Homepage = "https://github.com/Qwen/Qwen3-TTS"
Repository = "https://github.com/Qwen/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_tts*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]
